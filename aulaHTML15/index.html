<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 15 - Cadastro de Usuário</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="form-container">
        <!-- Div para exibir a mensagem de sucesso no topo -->
        <div id="alertaSucesso" class="alerta-topo" style="display: none;"></div>

        <h2>Formulário de Cadastro</h2>

        <form id="formCadastro" onsubmit="cadastrar(event)">
            <div class="input-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" placeholder="(11) 99999-9999" required>
            </div>

            <button type="submit" class="btn-enviar">Cadastrar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
